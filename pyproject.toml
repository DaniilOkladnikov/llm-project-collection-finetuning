[project]
name = "finetuning"
version = "0.1.0"
description = "Finetuning scripts for LLM Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tool-simulation-server",
    "httpx>=0.27",
    "mcp>=1.0",
    "pydantic>=2.0",
    "numpy>=1.26",
    "torch>=2.3",
    "transformers>=4.43,<5",
    "datasets>=2.20",
    "wandb>=0.17",
    "unsloth>=2024.8",
    "optuna>=4.8.0",
    "scipy>=1.15.3",
    "matplotlib>=3.10.8",
    "tqdm>=4.66",
]

[tool.uv.sources]
tool-simulation-server = { git = "ssh://git@gitlab.cc-asp.fraunhofer.de/cpps/skillbasedcontrolframework/sbc_llm/tool-simulation-server.git" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
