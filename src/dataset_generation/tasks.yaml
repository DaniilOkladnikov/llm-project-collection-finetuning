# Every answer macro carries a stable `id`. The id is written into each dataset
# entry's metadata as `answer_macro_id`, so rows can be grouped by which answer
# fired without re-deriving it from the rendered text. Ids are permanent: append
# new macros with the next free id, never renumber.
answers:
  "mustplace": {id: 1, text: "I must first place what I hold"}
  "picked(X, loc)": {id: 2, text: "I picked up {X} from {loc}"}
  "placed(X, loc)": {id: 3, text: "I placed {X} in {loc}"}
  "donthold": {id: 4, text: "I don't hold anything"}
  "released": {id: 5, text: "I released the gripper"}
  "canthelp": {id: 6, text: "Sorry, but I can't assist you with this task"}
  "got(X)": {id: 7, text: "I got {X} from you"}
  "nospace2place(A)": {id: 8, text: "There is no empty space in {A}"}
  "heldunknown": {id: 9, text: "I don't know what I'm holding"}
  "holding(X)": {id: 10, text: "I am holding {X}"}
  "gripperunknown": {id: 11, text: "I don't know if the gripper is open or closed"}
  "gripperclosed": {id: 12, text: "The gripper is closed"}
  "gripperopen": {id: 13, text: "The gripper is open"}
  "atpos(P)": {id: 14, text: "I am at {P}"}
  "posunknown": {id: 15, text: "I don't know my position"}
  "athome": {id: 16, text: "Yes, I am at home"}
  "notathome(P)": {id: 17, text: "No, I am at {P}"}
  "isfull(A)": {id: 18, text: "{A} is full"}
  "notfull(A)": {id: 19, text: "{A} is not full"}
  "isempty(L[A])": {id: 20, text: "{L[A]} is empty"} # Here and further, L[A] denotes list of targets (location or locations collection), all locations are written using coma, no [] in the displayed string, same rules for L[X], list of objects (types)
  "isnonempty(A)": {id: 21, text: "{A} is not empty"}
  "thereis(X,A)": {id: 22, text: "There is {X} in {A}"}
  "nameobjects(A)": {id: 23, text: "scans[loc] for loc in A"}
  "thereisno(L[X],L[A])": {id: 24, text: "There is no {L[X]} in {L[A]}"}
  "locof(X,L[A])": {id: 25, text: "There is X is in loc for loc in A if scans[loc] = X"}
  "thereisonly(L[X],L[A])": {id: 26, text: "There is only {L[X]} in {L[A]}"}
  "gotfrom(X,loc)": {id: 27, text: "I got {X} from {loc}"}
  "emptylocs(A)": {id: 28, text: "MEMORY.scans[A] where value is empty"} # comma separated list values
  "received": {id: 29, text: "Alright, I am holding it now"}
  "noneedplace": {id: 30, text: "No, the gripper is free, you can pick right away"}
  "canpick(A)": {id: 31, text: "Yes, the gripper is free and there is something to pick in {A}"}
  "firstemptyat(loc)": {id: 32, text: "The first empty location is {loc}"}
  "lastpicked(X)": {id: 33, text: "The last thing I picked up was {X}"}
  "projectedafter(A)": {id: 34, text: "Afterwards {A} would contain the remaining objects"} # scans[A] minus the found object's location
  "atleastonenonempty(A, B)": {id: 35, text: "No, at least one of {A} and {B} has something in it"}
  "atleastoneempty(A, B)": {id: 36, text: "Yes, at least one of {A} and {B} is empty"}
  "neitherempty(A, B)": {id: 37, text: "No, both {A} and {B} have something in them"}
  "toolerror": {id: 38, text: "unexpected error happened, I cannot proceed"}
  "closedgripper": {id: 39, text: "I closed the gripper"} # the action; `gripperclosed` reports the state

tasks:
  1:
    prompts: ["Pick up {X} from {A}", "Grab the {X} that is in {A}", "Take an {X} out of {A}", "Get me the {X} from {A}", "From {A}, pick up an {X}"]
    program:
      "check gripper
      if MEMORY.gripper is closed:
        answer_1: mustplace [3]
      else:
        observe A
      remember loc = first in MEMORY.scans[A] where value is X
      if loc is not none:
        pick from loc
        answer_2: picked(X, loc) [10]
      else:
        answer_3: thereisno([X],[A]) [4]
      "
