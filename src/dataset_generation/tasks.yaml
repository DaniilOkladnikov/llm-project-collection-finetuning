answers: 
  "mustplace": "I must first place what I hold"
  "picked(X, loc)": "I picked up {X} from {loc}"
  "placed(X, loc)": "I placed {X} in {loc}"
  "donthold": "I don't hold anything"
  "released": "I released the gripper"
  "canthelp": "Sorry, but I can't assist you with this task"
  "got(X)": "I got {X} from you"
  "donthold": "I don't hold anything"
  "nospace2place(A)": "There is no empty space in {A}"
  "heldunknown": "I don't know what I'm holding"
  "holding(X)": "I am holding {X}"
  "gripperunknown": "I don't know if the gripper is open or closed"
  "gripperclosed": "The gripper is closed"
  "gripperopen": "The gripper is open"
  "gripperopen": "The gripper is open"
  "atpos(P)": "I am at {P}"
  "posunknown": "I don't know my position"
  "atpos(P)": "I am at {P}"
  "isfull(A)": "{A} is full"
  "notfull(A)": "{A} is not full"
  "isempty(L[A])": "{L[A]} is empty" # Here and further, L[A] denotes list of targets (location or locations collection), all locations are written using coma, no [] in the displayed string, same rules for L[X], list of objects (types)
  "isnonempty(A)": "{A} is not empty"
  "thereis(X,A)": "There is {X} in {A}"
  "nameobjects(A)": "scans[loc] for loc in A"
  "thereis(X,A)": "There is {X} in {A}"
  "thereisno(L[X],L[A])": "There is no {L[X]} in {L[A]}" 
  "locof(X,L[A])": "There is X is in loc for loc in A if scans[loc] = X"
  "thereisno(L[X],L[A])": "There is no {L[X]} in {L[A]}"
  "thereisonly(L[X],L[A])": "There is only {L[X]} in {L[A]}"
  "gotfrom(X,loc)": "I got {X} from {loc}"
  "emptylocs(A)": "MEMORY.scans[A] where value is empty" # comma separated list values

tasks:
  1: 
    prompts: ["Pick up {X} from {A}"] 
    program:
      "check gripper
      if MEMORY.gripper is closed:
        answer_1: mustplace
      else:
        observe A
      remember loc = first in MEMORY.scans[A] where value is X
      if loc is not none:
        pick from loc
        answer_2: picked(X, loc)
      else:
        answer_3: thereisno([X],[A])
      "
  2: 
    prompts: ["Close gripper, I am giving you {X}"]
    program:
      "
      check gripper
      if MEMORY.gripper is closed:
        answer_1: mustplace
      else:
        get X from user 
        answer_2: got(X)
      "
  3:
    prompts: ["Release what you hold"]
    program:
      "
      check gripper
      if MEMORY.gripper is open:
        answer_1: donthold
      else:
        open gripper
        answer_2: released
      "
  4:
    prompts: ["You are holding {X}. Place it into {A}"]
    state_change: 
      - gripper: closed
      - held: X
    program:
      "
      observe A
      remember loc = first in MEMORY.scans[A] where value is empty
      if loc is not none:
        place in loc
        answer_2: placed(X, loc)
      else:
        answer_3: nospace2place(A)
      "
  5:
    prompts: ["Am I holding {X}?", "What are you holding?"]
    program:
      "answer_1":
        if MEMORY.held is unknown: "heldunknown"
        else: "holding(MEMORY.held)"
  6:
    prompts: ["Is your gripper free?"]
    program:
      "answer_1":
        if MEMORY.gripper is unknown: "gripperunknown"
        elif MEMORY.gripper is closed: "gripperclosed"
        else: "gripperopen"
