answers: 
  "mustplace": "I must first place what I hold"
  "picked(X, loc)": "I picked up {X} from {loc}"
  "placed(X, loc)": "I placed {X} in {loc}"
  "donthold": "I don't hold anything"
  "released": "I released the gripper"
  "canthelp": "Sorry, but I can't assist you with this task"
  "got(X)": "I got {X} from you"
  "donthold": "I don't hold anything"
  "nospace2place(A)": "There is no empty space in {A}"
  "heldunknown": "I don't know what I'm holding"
  "holding(X)": "I am holding {X}"
  "gripperunknown": "I don't know if the gripper is open or closed"
  "gripperclosed": "The gripper is closed"
  "gripperopen": "The gripper is open"
  "gripperopen": "The gripper is open"
  "atpos(P)": "I am at {P}"
  "posunknown": "I don't know my position"
  "atpos(P)": "I am at {P}"
  "athome": "Yes, I am at home"
  "notathome(P)": "No, I am at {P}"
  "isfull(A)": "{A} is full"
  "notfull(A)": "{A} is not full"
  "isempty(L[A])": "{L[A]} is empty" # Here and further, L[A] denotes list of targets (location or locations collection), all locations are written using coma, no [] in the displayed string, same rules for L[X], list of objects (types)
  "isnonempty(A)": "{A} is not empty"
  "thereis(X,A)": "There is {X} in {A}"
  "nameobjects(A)": "scans[loc] for loc in A"
  "thereis(X,A)": "There is {X} in {A}"
  "thereisno(L[X],L[A])": "There is no {L[X]} in {L[A]}" 
  "locof(X,L[A])": "There is X is in loc for loc in A if scans[loc] = X"
  "thereisno(L[X],L[A])": "There is no {L[X]} in {L[A]}"
  "thereisonly(L[X],L[A])": "There is only {L[X]} in {L[A]}"
  "gotfrom(X,loc)": "I got {X} from {loc}"
  "emptylocs(A)": "MEMORY.scans[A] where value is empty" # comma separated list values
  "received": "Alright, I am holding it now"
  "noneedplace": "No, the gripper is free, you can pick right away"
  "canpick(A)": "Yes, the gripper is free and there is something to pick in {A}"
  "firstemptyat(loc)": "The first empty location is {loc}"
  "lastpicked(X)": "The last thing I picked up was {X}"
  "projectedafter(A)": "Afterwards {A} would contain the remaining objects" # scans[A] minus the found object's location
  "atleastonenonempty(A, B)": "No, at least one of {A} and {B} has something in it"
  "atleastoneempty(A, B)": "Yes, at least one of {A} and {B} is empty"
  "neitherempty(A, B)": "No, both {A} and {B} have something in them"

tasks:
  1: 
    prompts: ["Pick up {X} from {A}", "I think there is a cube in A, go get it"]
    program:
      "check gripper
      if MEMORY.gripper is closed:
        answer_1: mustplace
      else:
        observe A
      remember loc = first in MEMORY.scans[A] where value is X
      if loc is not none:
        pick from loc
        answer_2: picked(X, loc)
      else:
        answer_3: thereisno([X],[A])
      "
  2: 
    prompts: ["Close gripper, I am giving you {X}"]
    program:
      "
      check gripper
      if MEMORY.gripper is closed:
        answer_1: mustplace
      else:
        get X from user 
        answer_2: got(X)
      "
  3:
    prompts: ["Release what you hold"]
    program:
      "
      check gripper
      if MEMORY.gripper is open:
        answer_1: donthold
      else:
        open gripper
        answer_2: released
      "
  4:
    prompts: ["You are holding {X}. Place it into {A}"]
    state_change: 
      - gripper: closed
      - held: X
    program:
      "
      observe A
      remember loc = first in MEMORY.scans[A] where value is empty
      if loc is not none:
        place in loc
        answer_2: placed(X, loc)
      else:
        answer_3: nospace2place(A)
      "
  5:
    prompts: ["Am I holding {X}?", "What are you holding?", "Do you know what you are holding?"]
    program:
      "answer_1":
        if MEMORY.held is unknown: "heldunknown"
        else: "holding(MEMORY.held)"
  6:
    prompts: ["Is your gripper free?"]
    program:
      "answer_1":
        if MEMORY.gripper is unknown: "gripperunknown"
        elif MEMORY.gripper is closed: "gripperclosed"
        else: "gripperopen"
  7:
    prompts: ["What position are you at?"]
    program:
      "answer_1":
        if MEMORY.position is unknown: "posunknown"
        else: "atpos(MEMORY.position)"
  8: 
    prompts: ["Go to {P position}", "Move to {P}"]
    program:
      "go to P
      answer_1: atpos(P)
      " # Note, P in the program is literally what user said, can be different from real position name, P in the answer in the actual position name saved in memory by parse user command and where the robot actually is.
  9:
    prompts: ["Go to the {observation point for A}"]
    program:
      "go to observation of A
      answer_1: atpos(observation point for A) 
      " # Note, here and further observation point for A in the program is literally what user said, observation point for A in the answer in the actual position name saved in memory by parse user command and where the robot actually is.
  10:
    prompts: ["Visit the observation points for {A} and then {B}"]
    program:
      "go to observation of A
      go to observation of B
