  11:
    prompts: ["Find empty space in A and go to position to pickup from there. And check if gripper is open", "Get ready to pick from empty in A"]
    program:
      "observe A
      check gripper
      if MEMORY.gripper is open:
        answer_1: mustplace
      remember loc = first in MEMORY.scans[A] where value is empty
      if loc is not none:
        go to pick MEMORY.scans[loc] from loc
        answer_2: atpos(loc)
      else:
        answer_3: isfull(A)
      "
  12:
    prompts: ["Prepare to pick something from A", "Find an object in A prepare to pick it"]
